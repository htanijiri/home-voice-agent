# Fly.io の設定のひな形。実際の値（アプリ名・URL・IP アドレス）を入れたものは fly.local.toml に置き、
# `fly deploy -c fly.local.toml` で使う（fly.local.toml は gitignore 済み。docs/DEPLOY.md）
app = "home-voice-agent-CHANGE-ME"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_BASE_URL = "https://home-voice-agent-CHANGE-ME.fly.dev"
  DEVICE_TRANSPORT = "mqtt"
  MQTT_PUBLIC_ENDPOINT = "home-voice-agent-CHANGE-ME.fly.dev:8883"
  # 端末に伝える UDP の接続先。専用の IPv4 アドレス（fly ips list）を書く
  UDP_PUBLIC_HOST = "0.0.0.0"
  # Fly.io で UDP を受けるには、この住所で待ち受ける必要がある
  UDP_BIND_HOST = "fly-global-services"
  LOG_LEVEL = "info"

[mounts]
  source = "hva_data"
  destination = "/data"
  snapshot_retention = 5

# HTTPS：OTA・確認画面・通知の音声・WebSocket
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/healthz"

# MQTT over TLS：TLS は Fly のプロキシで終端し、アプリには平文の TCP で渡す
[[services]]
  internal_port = 1883
  protocol = "tcp"
  auto_stop_machines = "off"
  [[services.ports]]
    port = 8883
    handlers = ["tls"]

# UDP：会話の音声（Xiaozhi の AES-CTR で暗号化される）
[[services]]
  internal_port = 8884
  protocol = "udp"
  [[services.ports]]
    port = 8884

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
